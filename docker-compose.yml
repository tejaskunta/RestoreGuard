services:
  postgres:
    image: postgres:16
    container_name: restoreguard-db
    environment:
      POSTGRES_USER: restoreguard
      POSTGRES_PASSWORD: restoreguard
      POSTGRES_DB: sourcedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreguard -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
